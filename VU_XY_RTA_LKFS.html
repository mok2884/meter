body { background-color: #050505; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; height: 100vh; font-family: sans-serif; }
.console { background: #1a1a1a; padding: 25px; border-radius: 12px; border: 2px solid #333; display: flex; flex-direction: column; align-items: center; gap: 15px; }
.display-row { display: flex; gap: 20px; align-items: flex-end; }
.unit { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.label { color: #eee; font-weight: bold; font-size: 16px; font-family: sans-serif; }
.meter { position: relative; width: 280px; height: 150px; background-color: #fdfae1; overflow: hidden; border-radius: 4px; border: 1px solid #444; }
.scope { position: relative; width: 220px; height: 220px; background-color: #000; border: 1px solid #444; border-radius: 4px; }
.needle {
    position: absolute;
    top: 170px;
    left: 140px;
    width: 0;
    height: 145px;
    margin-top: -145px;
    transform-origin: bottom center;
    z-index: 10;
}

.needle::before {
    content: "";
    position: absolute;
    left: -3px;
    bottom: 0;
    width: 6px;
    height: 145px;
    background: #111;
    clip-path: polygon(
        33% 0%,
        67% 0%,
        100% 100%,
        0% 100%
    );
}
    
.controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; color: #aaa; margin-top: 10px; }
.knob-group { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 12px; }
select { background: #333; color: #fff; border: 1px solid #555; padding: 5px; border-radius: 4px; width: 200px; margin-bottom: 10px; }
input[type=range] { width: 130px; cursor: pointer; }
#btn { padding: 10px 30px; cursor: pointer; font-weight: bold; border-radius: 4px; border: none; background: #444; color: white; }
#btn.on { background: #d00; }
canvas { position: absolute; top: 0; left: 0; z-index: 5; }

    width:760px;
    height:260px;
    background:#050505;
    border:1px solid #444;
    box-sizing:border-box;
}

#rtaCanvas {
    position:static;
    display:block;
}

    border:2px solid #333;
    border-radius:12px;

<script>
    function fitScreen(){

    const panel =
        document.getElementById("mainPanel");

    panel.style.transform = "scale(1)";

    const rect =
        panel.getBoundingClientRect();

    const scaleX =
        window.innerWidth / rect.width;

    const scaleY =
        window.innerHeight / rect.height;

    const scale =
        Math.min(scaleX, scaleY) * 0.85;

    panel.style.transform =
        `scale(${scale})`;
}

window.addEventListener("resize", fitScreen);
window.addEventListener("load", fitScreen);
// Wake Lock 関連の処理
let wakeLock = null;
const requestWakeLock = async () => {
    try {
        if ('wakeLock' in navigator) {
            wakeLock = await navigator.wakeLock.request('screen');
        }
    } catch (err) {}
};

// 初回操作時に Wake Lock を有効にする
document.body.addEventListener('pointerdown', () => { 
    if (!wakeLock) requestWakeLock(); 
}, { once: true });

document.addEventListener('visibilitychange', () => {
    if (wakeLock !== null && document.visibilityState === 'visible') requestWakeLock();
});

const VU_W = 280, VU_H = 150, CX = 140, CY = 170, R_BASE = 125;
const START_DEG = 145, END_DEG = 35;
const V_MIN = Math.pow(10, -20/20), V_MAX = Math.pow(10, 3/20);

// ===== 目盛り円弧の平たさ =====
// 円弧の中心を、針の軸からどれだけ下げるか(px)。
// 0 で今までと同じ同心円。大きくするほど平たくなる。
const ARC_DROP = 60;

// 振り切り位置で、針の軸から円弧までの距離(px)。
// 針の長さは145。145に近づけるほど、両端で針先と円弧が近づく。
const ARC_END = 135;

// 円弧の半径：両端(振り切り位置)が ARC_END の場所を通るように決める
const ARC_R = (() => {
    const a = START_DEG * Math.PI / 180;
    return Math.hypot(
        Math.cos(a) * ARC_END,
        Math.sin(a) * ARC_END + ARC_DROP
    );
})();

// 針の軸から、その角度の方向にある円弧までの距離
function arcDist(rad){
    const uy = Math.sin(rad);
    return ARC_DROP * uy +
        Math.sqrt(ARC_R * ARC_R - ARC_DROP * ARC_DROP * (1 - uy * uy));
}

function dbToAngle(db){
    const v = Math.pow(10, db/20);
    const norm = (v - V_MIN)/(V_MAX - V_MIN);
    return START_DEG + (norm * (END_DEG - START_DEG));
}

function drawVUBase(canvasId) {
    const ctx = document.getElementById(canvasId).getContext("2d");
    ctx.clearRect(0, 0, VU_W, VU_H);
    const mainMarks = [-20, -10, -7, -5, -3, -2, -1, 0, 1, 2, 3];
    for(let v = -20; v <= 3; v += 0.25) {
        const rad = (-dbToAngle(v)) * Math.PI / 180;
        const r = arcDist(rad);
        const isRed = (v >= 0);
        const isMain = mainMarks.includes(v);
        ctx.beginPath();
        ctx.strokeStyle = isRed ? "#d00" : "#222";
        ctx.lineWidth = isMain ? 2.5 : 0.8;
        let tLen = isMain ? (isRed ? 15 : 10) : 5;
        ctx.moveTo(CX + Math.cos(rad) * r, CY + Math.sin(rad) * r);
        ctx.lineTo(CX + Math.cos(rad) * (r + tLen), CY + Math.sin(rad) * (r + tLen));
        ctx.stroke();
        if ([-20, -10, -7, -5, -3, 0, 3].includes(v)) {
            ctx.font = "bold 15px Arial"; ctx.fillStyle = isRed ? "#d00" : "#222"; ctx.textAlign = "center";
            // 数字が窓からはみ出すときだけ、内側に寄せる(両端の数字用)
            const half = ctx.measureText(Math.abs(v)).width / 2;
            const lx = Math.max(4 + half, Math.min(VU_W - 4 - half, CX + Math.cos(rad)*(r+28)));
            ctx.fillText(Math.abs(v), lx, CY + Math.sin(rad)*(r+28)+5);
        }
    }
}
drawVUBase("cvsL"); drawVUBase("cvsR");

const micSelect = document.getElementById('micSelect');
const btn = document.getElementById("btn");
let audioCtx, stream, currentL = START_DEG, currentR = START_DEG;
// ===== ラウドネス設定 =====
const LOUD_TARGET = -24;            // 目標 (LKFS)。バーと履歴グラフに線を引く
const LOUD_MIN = -50;               // バーと履歴グラフの下端 (LKFS)
const LOUD_MAX = -10;               // バーと履歴グラフの上端 (LKFS)
const LOUD_BAR_SEC = 3;              // 履歴グラフのバー1本の秒数
const LOUD_HIST_MIN = 12;            // 履歴グラフ全体の長さ (分)
const LOUD_HIST_BARS = LOUD_HIST_MIN * 60 / LOUD_BAR_SEC;   // バーの本数

// 色の変わり目 [LKFS, [R,G,B]]。バーの高さ方向のグラデーションになる
// いちばん下の色は、それより下ぜんぶに使う
const LOUD_COLORS = [
    [-49, [ 45, 125, 150]],   // 緑よりの青 (ここから下はこの色)
    [-43, [ 55, 165,  95]],   // 緑
    [-35, [ 85, 175,  85]],   // 緑 (ここまで緑を保つ)
    [-28, [150, 195,  60]],   // 黄緑
    [-24, [232, 202,  45]],   // 黄 (目標のあたり)
    [-19, [236, 170,  45]],   // 黄よりのオレンジ
    [-14, [222,  58,  42]]    // 赤 (ここから上は赤)
];

// 色の変わり目を、表示範囲の中の位置(0〜1)に直す
function loudStops(){
    return LOUD_COLORS.map(c => [
        Math.max(0, Math.min(1, (c[0] - LOUD_MIN) / (LOUD_MAX - LOUD_MIN))),
        `rgb(${c[1]})`
    ]);
}

// K特性フィルター (ITU-R BS.1770)。サンプルレートに合わせて係数を作る
class LoudBiquad {
    constructor(b, a){
        this.b0 = b[0]; this.b1 = b[1]; this.b2 = b[2];
        this.a1 = a[0]; this.a2 = a[1];
        this.x1 = this.x2 = this.y1 = this.y2 = 0;
    }
    run(x){
        const y = this.b0 * x + this.b1 * this.x1 + this.b2 * this.x2
                - this.a1 * this.y1 - this.a2 * this.y2;
        this.x2 = this.x1; this.x1 = x;
        this.y2 = this.y1; this.y1 = y;
        return y;
    }
}

function makeKWeight(rate){
    // 高域シェルフ
    let K = Math.tan(Math.PI * 1681.974450955533 / rate);
    let Q = 0.7071752369554196;
    const Vh = Math.pow(10, 3.999843853973347 / 20);
    const Vb = Math.pow(Vh, 0.4996667741545416);
    let a0 = 1 + K / Q + K * K;
    const shelf = {
        b: [(Vh + Vb * K / Q + K * K) / a0, 2 * (K * K - Vh) / a0, (Vh - Vb * K / Q + K * K) / a0],
        a: [2 * (K * K - 1) / a0, (1 - K / Q + K * K) / a0]
    };
    // 低域カット
    K = Math.tan(Math.PI * 38.13547087602444 / rate);
    Q = 0.5003270373238773;
    a0 = 1 + K / Q + K * K;
    const hp = {
        b: [1, -2, 1],
        a: [2 * (K * K - 1) / a0, (1 - K / Q + K * K) / a0]
    };
    return { shelf, hp };
}

function toLkfs(e){
    return e > 0 ? -0.691 + 10 * Math.log10(e) : -120;
}

let loudM = -120, loudS = -120;     // いまのM / S
let loudI = null;                   // 積算値 (STARTを押すまで null)
let loudRun = false;                // 積算中かどうか
let loudRunBlocks = 0;
const loudRing = [];                // 100msごとのパワー。直近3秒分だけ持つ
const loudHist = [];                // 履歴グラフ用。確定したバーの値だけ持つ
let loudHistCnt = 0;                // 進行中のバーが何個ぶんの100msを数えたか
let loudDirty = true;               // 履歴グラフを描き直す必要があるか

// 文字が変わったときだけ画面を書き換える (毎回書き換えると無駄に重い)
const textCache = {};
function setText(id, str){
    const c = textCache[id] || (textCache[id] = { el: document.getElementById(id), last: null });
    if (c.last !== str) { c.last = str; c.el.innerText = str; }
}

// 積算用のレベル別集計表 (-70 〜 +10 LKFS を 0.1 刻み)。大きさは固定
const GATE_BINS = 800;
const gateCnt = new Float64Array(GATE_BINS);
const gateSum = new Float64Array(GATE_BINS);

function loudReset(){
    gateCnt.fill(0);
    gateSum.fill(0);
    loudI = null;
    loudRunBlocks = 0;
}

// 400msブロックを1個、積算に加える
function loudAddBlock(e){
    const l = toLkfs(e);
    if (l <= -70) return;                               // 絶対ゲート
    const idx = Math.min(GATE_BINS - 1, Math.floor((l + 70) * 10));
    gateCnt[idx]++;
    gateSum[idx] += e;

    let n = 0, s = 0;
    for (let i = 0; i < GATE_BINS; i++) { n += gateCnt[i]; s += gateSum[i]; }
    if (!n) return;

    const rel = toLkfs(s / n) - 10;                     // 相対ゲート
    const from = Math.max(0, Math.ceil((rel + 70) * 10 - 1e-9));
    n = 0; s = 0;
    for (let i = from; i < GATE_BINS; i++) { n += gateCnt[i]; s += gateSum[i]; }
    if (n) loudI = toLkfs(s / n);
}

// 100msぶんのパワー(L+R)を受け取る
function loudPush(e){
    loudRing.push(e);
    if (loudRing.length > 30) loudRing.shift();

    const len = loudRing.length;
    let s4 = 0, s30 = 0;
    for (let i = 0; i < len; i++) {
        s30 += loudRing[i];
        if (i >= len - 4) s4 += loudRing[i];
    }
    loudM = toLkfs(s4 / Math.min(4, len));
    loudS = toLkfs(s30 / len);

    // 3秒たったら、その3秒ぶんの値をバー1本として確定する
    if (++loudHistCnt >= LOUD_BAR_SEC * 10) {
        loudHistCnt = 0;
        loudHist.push(loudS);
        if (loudHist.length > LOUD_HIST_BARS - 1) loudHist.shift();
    }
    loudDirty = true;

    if (loudRun && ++loudRunBlocks >= 4) loudAddBlock(s4 / 4);
}

// 履歴グラフ (RTAの枠に描く)
let rtaMode = "rta";

function drawLoudHistory(){
    const cv = document.getElementById("rtaCanvas");
    const g = cv.getContext("2d");
    const pitch = 3;     // 3秒ぶんの横幅(px)
    const x1 = cv.width - 10, x0 = x1 - LOUD_HIST_BARS * pitch;
    const yTop = 10, yBot = 220;
    const yOf = v => yBot - (v - LOUD_MIN) / (LOUD_MAX - LOUD_MIN) * (yBot - yTop);

    g.fillStyle = "#050505";
    g.fillRect(0, 0, cv.width, cv.height);

    g.font = "12px sans-serif";
    g.lineWidth = 1;
    g.textAlign = "right";
    for (let v = LOUD_MIN; v <= LOUD_MAX; v += 10) {
        g.strokeStyle = "rgba(255,255,255,0.12)";
        g.beginPath(); g.moveTo(x0, yOf(v)); g.lineTo(x1, yOf(v)); g.stroke();
        g.fillStyle = "#aaa";
        g.fillText(v, x0 - 6, yOf(v) + 4);
    }

    const grad = g.createLinearGradient(0, yBot, 0, yTop);
    loudStops().forEach(st => grad.addColorStop(st[0], st[1]));
    g.fillStyle = grad;

    // 3秒ごとの値を点にして、なめらかな曲線でつなぎ、その下を塗る
    // 右端が進行中の値 (リアルタイム)。左へ行くほど古い
    const vals = loudHist.concat([loudS]);
    const pts = vals.map((v, k) => ({
        x: x1 - (vals.length - 1 - k + 0.5) * pitch,
        y: yOf(Math.max(LOUD_MIN, Math.min(LOUD_MAX, v)))
    }));
    g.beginPath();
    g.moveTo(pts[0].x, yBot);
    g.lineTo(pts[0].x, pts[0].y);
    for (let k = 1; k < pts.length; k++) {
        // 点と点の中間を通る曲線にすると、角が立たない
        const mx = (pts[k - 1].x + pts[k].x) / 2;
        const my = (pts[k - 1].y + pts[k].y) / 2;
        g.quadraticCurveTo(pts[k - 1].x, pts[k - 1].y, mx, my);
    }
    const last = pts[pts.length - 1];
    g.lineTo(last.x, last.y);
    g.lineTo(x1, last.y);
    g.lineTo(x1, yBot);
    g.closePath();
    g.fill();

    // 目標の線
    g.strokeStyle = "rgba(255,255,255,0.8)";
    g.beginPath(); g.moveTo(x0, yOf(LOUD_TARGET)); g.lineTo(x1, yOf(LOUD_TARGET)); g.stroke();
    g.fillStyle = "#fff";
    g.fillText(LOUD_TARGET, x0 - 6, yOf(LOUD_TARGET) + 4);

    g.fillStyle = "#aaa";
    g.textAlign = "center";
    for (let m = 0; m <= LOUD_HIST_MIN; m += 3) {
        g.fillText(m === 0 ? "0" : "-" + m + "分",
            x1 - m * 60 / LOUD_BAR_SEC * pitch, 245);
    }
}

// RTA / LOUDNESS の切り替え。選んでいるほうのボタンが光る
function setRtaMode(mode){
    rtaMode = mode;
    document.getElementById("tabRta").classList.toggle("on", mode === "rta");
    document.getElementById("tabLoud").classList.toggle("on", mode === "loud");
    loudDirty = true;
    if (mode === "loud") {
        drawLoudHistory();
    } else if (!audioCtx) {
        const cv = document.getElementById("rtaCanvas");
        cv.getContext("2d").clearRect(0, 0, cv.width, cv.height);
    }
}
document.getElementById("tabRta").onclick = () => setRtaMode("rta");
document.getElementById("tabLoud").onclick = () => setRtaMode("loud");

// M/Sバーの色。枠の高さに固定したグラデーションを、バーの高さぶんだけ見せる
["barM", "barS"].forEach(id => {
    const el = document.getElementById(id);
    el.style.background =
        "linear-gradient(to top, " +
        loudStops().map(st => st[1] + " " + (st[0] * 100) + "%").join(", ") +
        ") bottom / 100% " + el.parentElement.style.height + " no-repeat";
});

// バーの目標線の位置
document.querySelectorAll(".loudTgt").forEach(el => {
    el.style.bottom =
        (LOUD_TARGET - LOUD_MIN) / (LOUD_MAX - LOUD_MIN) * 100 + "%";
});

// START / STOP / RESET
document.getElementById("lkfsStart").onclick = () => {
    loudRun = !loudRun;
    loudRunBlocks = 0;
    document.getElementById("lkfsStart").innerText = loudRun ? "STOP" : "START";

{

    for (let k = kMin; k <= kMax; k++) {

const RTA_NORM = 2 / 0.3046;

function rtaBandPower(data, fftSize, f1, f2){
    const binHz = audioCtx.sampleRate / fftSize;
    const lo = f1 / binHz, hi = f2 / binHz;
    const iEnd = Math.min(data.length - 1, Math.floor(hi + 0.5));
    let p = 0;
    for (let i = Math.max(1, Math.floor(lo + 0.5)); i <= iEnd; i++) {
        const w = Math.min(hi, i + 0.5) - Math.max(lo, i - 0.5);
        if (w > 0) p += Math.pow(10, data[i] / 10) * w;
    }
    return p * RTA_NORM;
}

let rtaLastT = performance.now();

    const makeVuAvg = () => ({ buf: new Float32Array(vuWin), pos: 0, n: 0, sum: 0, tick: 0 });
    const vuAvgL = makeVuAvg(), vuAvgR = makeVuAvg();
    function vuAvgPush(a, src, count){

            a.buf[a.pos] = Math.abs(src[i]);

const vuN = Math.min(bufL.length, Math.floor(vuCarry));
vuCarry -= Math.floor(vuCarry);

const loudPct = v => Math.max(0, Math.min(100,

function freqX(freq){

    const min = 20;

       Math.log10(freq/min) /

    );
}
